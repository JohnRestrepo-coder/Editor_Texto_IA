openapi: 3.1.0
info:
  title: AI Document Studio API
  version: 1.0.0
  description: Contrato inicial propuesto. Debe mantenerse sincronizado con la implementación.
servers:
  - url: /api/v1
paths:
  /documents:
    post:
      summary: Crear documento
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: Documento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
    get:
      summary: Listar documentos
      operationId: listDocuments
      responses:
        '200':
          description: Lista de documentos
  /documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Obtener documento
      operationId: getDocument
      responses:
        '200':
          description: Documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: No encontrado
    put:
      summary: Actualizar documento con control de versión
      operationId: updateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: Actualizado
        '409':
          description: Conflicto de versión
    delete:
      summary: Eliminar documento
      operationId: deleteDocument
      responses:
        '204':
          description: Eliminado
  /templates:
    post:
      summary: Crear plantilla nativa
      operationId: createTemplate
      responses:
        '201':
          description: Plantilla creada
    get:
      summary: Listar plantillas
      operationId: listTemplates
      responses:
        '200':
          description: Plantillas
  /templates/{template_id}:
    get:
      summary: Obtener plantilla
      operationId: getTemplate
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plantilla
        '404':
          description: No encontrada
  /templates/import-docx:
    post:
      summary: Importar archivo DOCX para configurar plantilla
      operationId: importDocxTemplate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Archivo recibido para inspección
        '400':
          description: Archivo no válido
  /sources:
    post:
      summary: Cargar fuente documental
      operationId: uploadSource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_id]
              properties:
                file:
                  type: string
                  format: binary
                document_id:
                  type: string
      responses:
        '202':
          description: Fuente recibida
  /generations/section:
    post:
      summary: Generar propuesta para una sección
      operationId: generateSection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionGenerationRequest'
      responses:
        '202':
          description: Generación aceptada o iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
  /generations/{generation_id}/accept:
    post:
      summary: Aceptar propuesta
      operationId: acceptGeneration
      parameters:
        - name: generation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Propuesta aplicada
        '409':
          description: Conflicto de versión
  /generations/{generation_id}/reject:
    post:
      summary: Rechazar propuesta
      operationId: rejectGeneration
      parameters:
        - name: generation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Propuesta rechazada
  /exports/docx:
    post:
      summary: Exportar documento DOCX
      operationId: exportDocx
      responses:
        '200':
          description: Archivo DOCX
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
  /exports/pdf:
    post:
      summary: Exportar documento PDF
      operationId: exportPdf
      responses:
        '200':
          description: Archivo PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
components:
  parameters:
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    DocumentCreate:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        template_id:
          type: [string, 'null']
        content:
          type: object
        language:
          type: string
          default: es
    DocumentUpdate:
      type: object
      required: [title, content, version]
      properties:
        title:
          type: string
        content:
          type: object
        version:
          type: integer
          minimum: 1
    Document:
      type: object
      required: [id, title, status, content, version]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, completed, archived]
        template_id:
          type: [string, 'null']
        content:
          type: object
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SectionGenerationRequest:
      type: object
      required: [document_id, section_id]
      properties:
        document_id:
          type: string
        section_id:
          type: string
        user_instructions:
          type: string
        context:
          type: object
        source_ids:
          type: array
          items:
            type: string
        expected_document_version:
          type: integer
    Generation:
      type: object
      required: [generation_id, document_id, section_id, status]
      properties:
        generation_id:
          type: string
        document_id:
          type: string
        section_id:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed, accepted, rejected]
        content:
          type: object
        metadata:
          type: object
